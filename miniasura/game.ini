[player]
; V2.6：Lv.1 开局（蓝图 §1），升级全靠打
name = 花果山小妖
level = 1
hp = 150
mp = 100
base_attack = 18
crit_rate = 20

[growth]
; 攻击力 = base_attack + (level-1) * attack_per_level（公式在 battle.lua）
attack_per_level = 3
; 血上限 = hp + (level-1) * hp_per_level（V2.2：等级成长带上血量，否则 12 场消耗战必死）
hp_per_level = 6
; V2.5/V2.6 经验曲线（公式住 battle.lua levelup）：每级所需 = exp_base × 距开局级数^(exp_pow_x100/100)
; 距开局级数 = 当前等级 - 开局等级 + 1；Lv.1 开局时级数=等级本身，即蓝图 §1 原值 60×lv^1.65
exp_base = 60
exp_pow_x100 = 165
; 等级上限：蓝图技能表止于 Lv.30，到顶后经验照攒但不再升级
level_cap = 30

[tower]
; V2.5 无底洞爬塔：第 N 层怪物数值 = base + N × per（层数即怪物等级）
; V2.6：经验改曲线 exp = exp_base × N^(exp_pow_x100/100)（与升级曲线同形，支撑 25→30 登顶）
hp_base = 30
hp_per_layer = 18
atk_base = 6
atk_per_layer = 2.2
exp_base = 30
exp_pow_x100 = 165
gold_base = 10
gold_per_layer = 5
; 每 5 层掉一次（走 [loot.tower]）、每 10 层是守层妖王（boss，逃跑必失败）
drop_every = 5
boss_every = 10

[fight]
; 普攻威力倍率
normal_power = 1.0

[bag]
; 背包容量（格）——仓库扩容后由金币升级（蓝图：金币去向）
capacity = 20

[potion]
; 战斗内用药：血瓶回上限百分比，蓝瓶回固定蓝量
hp_pct = 40
mp_flat = 30

[shop]
; 白装回收折算经验（金币 V2.3 前的临时货币）：(base + lv*per_lv) * pct%
recycle_base = 5
recycle_per_lv = 3
recycle_pct = 30


[skill.dinghai]
; 威力 = 倍率 × 玩家攻击力
power = 2.5
mp_cost = 20

[skill.jindou]
power = 1.5
mp_cost = 10

[skill.qishi]
power = 3.0
mp_cost = 35

