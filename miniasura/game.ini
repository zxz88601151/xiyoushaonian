[loot.boss]
; staff = 无级别武器「如意金箍棒·无级」1% 掉率（已持有则跳过继续掷后面的普通掉落）
pool = staff:0:1, weapon:2:100, armor:2:50

[loot.tower]
; V2.5 无底洞：每 drop_every 层掉一次
pool = weapon:1:30, armor:1:20, boots:1:15
