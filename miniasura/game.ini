; V2.3 掉落池：怪物 → 部位:品质:概率, ...（按顺序掷骰，第一项掷中即停）
[loot.xiaoyao1]
pool = weapon:0:30, helm:0:20

[loot.xiaoyao2]
pool = weapon:1:25, armor:0:25

[loot.xiaoyao3]
